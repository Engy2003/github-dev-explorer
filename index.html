<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub Profile Finder</title>
    <meta
      name="description"
      content="A professional web application to search and explore GitHub user profiles, statistics, and latest repositories instantly."
    />
    <meta name="robots" content="index, follow" />
    <link
      rel="canonical"
      href="https://engy2003.github.io/github-dev-explorer/"
    />
    <!-- Open Graph (Facebook, LinkedIn) -->
    <meta property="og:title" content="GitHub Profile Finder" />
    <meta
      property="og:description"
      content="A professional web application to search and explore GitHub user profiles, statistics, and latest repositories instantly."
    />
    <meta property="og:type" content="website" />
    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="GitHub Profile Finder" />
    <meta
      name="twitter:description"
      content="A professional web application to search and explore GitHub user profiles, statistics, and latest repositories instantly."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23fcd34d'/><text x='50%' y='54%' font-family='sans-serif' font-weight='bold' font-size='42' fill='%230f172a' text-anchor='middle' dominant-baseline='middle'>GPF</text></svg>"
    />
    <link rel="stylesheet" href="./index.css" />
  </head>
  <body>
    <main class="container">
      <header class="header">
        <h1>GitHub Profile Finder</h1>
        <p>
          Search any GitHub user to see their profile and latest repositories.
        </p>
      </header>
      <section class="search-section">
        <div class="search-box">
          <input type="text" id="search-input" placeholder="user-name" />
          <button id="search-btn">Search</button>
        </div>
        <div class="suggestions">
          <span>Try:</span>
          <button class="chip" data-user="torvalds">torvalds</button>
          <button class="chip" data-user="gaearon">gaearon</button>
          <button class="chip" data-user="sindresorhus">sindresorhus</button>
        </div>
      </section>
      <section id="profile-container"></section>
      <section id="repos-container"></section>
    </main>
    <footer class="footer">
      <p>
        &copy; 2026 Developed by
        <a
          href="https://github.com/Engy2003"
          target="_blank"
          rel="noopener noreferrer"
          >Engy</a
        >. All rights reserved.
      </p>
    </footer>
    <script src="./index.js"></script>
  </body>
</html>
